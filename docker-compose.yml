# Xudbin paneli. Caddy (alan adları, HTTPS, WAF) panel tarafından her sunucuda ayrıca yönetilir.
name: xudbin

services:
  xudbin:
    build: .
    image: ${XUDBIN_IMAGE:-xudbin:local}
    container_name: xudbin
    restart: unless-stopped
    environment:
      TRUST_PROXY: "true"
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      DISK_PATH: /data
      HOST_HOSTNAME: ${HOST_HOSTNAME:-}
      XUDBIN_DOMAIN: ${XUDBIN_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      XUDBIN_HTTPS: ${XUDBIN_HTTPS:-1}
      XUDBIN_PUBLIC_IP: ${XUDBIN_PUBLIC_IP:-}
      XUDBIN_ACME_CA: ${XUDBIN_ACME_CA:-}
      # Panelin IP ile açıldığı port (https://<ip>:8443, kendinden imzalı sertifika); 0 ise kapalı.
      XUDBIN_IP_PORT: ${XUDBIN_IP_PORT:-8443}
      # Kurulum betiğinin imzasını doğruladığı Caddy imajı (özetle); boşsa panel Caddy'yi yerelde derler.
      XUDBIN_CADDY_IMAGE: ${XUDBIN_CADDY_IMAGE:-ghcr.io/furkan1116/xudbin-caddy:1}
    volumes:
      - xudbin-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Yalnız güncelleme durumu dosyası (install.sh yazar); sunucu kökü panele bağlanmaz.
      - /opt/xudbin/status:/host-status:ro
    # Panel yalnız docker.sock ve /data ile çalışır: tüm yetkiler düşürülür, yalnız dosya sahipliği/erişimi
    # için gerekenler geri verilir (Compose uygulama dizinlerini ve yedekleri root olmayan UID'lerle paylaşır).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    # Panel yalnız Caddy ile aynı ağda; uygulamalar panelin API'sine doğrudan ulaşamaz.
    networks: [panel]

volumes:
  xudbin-data:

networks:
  panel:
    name: xudbin-panel
