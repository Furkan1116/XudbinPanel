# Xudbin paneli. Caddy (alan adları, HTTPS, WAF) panel tarafından her sunucuda ayrıca yönetilir.
name: xudbin

services:
  xudbin:
    build: .
    image: xudbin:local
    container_name: xudbin
    restart: unless-stopped
    environment:
      TRUST_PROXY: "true"
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      DISK_PATH: /host
      HOST_HOSTNAME: ${HOST_HOSTNAME:-}
      XUDBIN_DOMAIN: ${XUDBIN_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      XUDBIN_HTTPS: ${XUDBIN_HTTPS:-1}
    volumes:
      - xudbin-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
    networks: [xudbin]

volumes:
  xudbin-data:

networks:
  xudbin:
    name: xudbin
