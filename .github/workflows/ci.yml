# Her push ve PR'da: tip kontrolü, testler, derleme. main'e ve v* etiketlerine gönderimde ayrıca
# panel ve Caddy imajları her mimari için kendi makinesinde derlenir (emülasyon yok), birleştirilir,
# SBOM ve köken (provenance) bilgisiyle yayınlanır ve Sigstore/cosign ile imzalanır.
#
# Eylemler sabit commit'lere bağlıdır (etiketler sonradan değiştirilemesin diye); yorumda sürümü var.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Betiklerin sözdizimi
        run: bash -n install.sh && bash -n scripts/xudbin && node --check cli/xb.mjs

  build:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [panel, caddy]
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: İmaj adı ve bağlam
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.image }}" = panel ]; then
            echo "name=ghcr.io/$owner/xudbin" >> "$GITHUB_OUTPUT"; echo "context=." >> "$GITHUB_OUTPUT"
          else
            # Caddy Dockerfile'ı panel kodundaki tek kaynaktan (caddy.ts) çıkarılır.
            mkdir -p /tmp/caddy
            sed -n '/^const CADDY_DOCKERFILE = `/,/^`;/p' apps/server/src/services/caddy.ts | sed '1d;$d' | sed 's/\\\\/\\/g' > /tmp/caddy/Dockerfile
            cat /tmp/caddy/Dockerfile
            echo "name=ghcr.io/$owner/xudbin-caddy" >> "$GITHUB_OUTPUT"; echo "context=/tmp/caddy" >> "$GITHUB_OUTPUT"
          fi
          echo "pair=${{ matrix.image }}-$(echo ${{ matrix.platform }} | tr / -)" >> "$GITHUB_OUTPUT"
      - name: Derle ve özetle (digest) gönder
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.meta.outputs.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.meta.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.pair }}
      - name: Özeti sakla
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ steps.meta.outputs.pair }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign anahtarsız imza (Sigstore)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Çok mimarili imajları birleştir, etiketle ve imzala
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for image in panel caddy; do
            if [ "$image" = panel ]; then name="ghcr.io/$owner/xudbin"; ref=latest; else name="ghcr.io/$owner/xudbin-caddy"; ref=1; fi
            tags="-t $name:$ref"
            if [ "${{ github.ref_type }}" = tag ] && [ "$image" = panel ]; then tags="$tags -t $name:${GITHUB_REF_NAME#v}"; fi
            sources=""
            for f in /tmp/digests/$image-*; do sources="$sources $name@$(cat "$f")"; done
            docker buildx imagetools create $tags $sources
            digest=$(docker buildx imagetools inspect "$name:$ref" --format '{{json .Manifest}}' | jq -r .digest)
            cosign sign --yes "$name@$digest"
            echo "$name@$digest imzalandı"
          done
