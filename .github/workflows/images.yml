# Hazır Docker imajları: kurulumda kaynak derlemesini (ve Caddy'nin Go derlemesini) atlamak için.
# Panel: ghcr.io/<sahip>/xudbin:{latest,sürüm}   Caddy: ghcr.io/<sahip>/xudbin-caddy:1
# İlk gönderimden sonra GitHub > Packages'ta iki paketi de "Public" yap ki kurulumlar indirebilsin.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: İmaj adları
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "panel=ghcr.io/$owner/xudbin" >> "$GITHUB_OUTPUT"
          echo "caddy=ghcr.io/$owner/xudbin-caddy" >> "$GITHUB_OUTPUT"
          tags="ghcr.io/$owner/xudbin:latest"
          if [[ "${{ github.ref_type }}" == tag ]]; then tags="$tags,ghcr.io/$owner/xudbin:${GITHUB_REF_NAME#v}"; fi
          echo "panel_tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Panel imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.panel_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Caddy Dockerfile'ı panel kodundaki tek kaynaktan (caddy.ts) çıkarılır.
      - name: Caddy Dockerfile
        run: |
          mkdir -p /tmp/caddy
          sed -n '/^const CADDY_DOCKERFILE = `/,/^`;/p' apps/server/src/services/caddy.ts | sed '1d;$d' | sed 's/\\\\/\\/g' > /tmp/caddy/Dockerfile
          cat /tmp/caddy/Dockerfile

      - name: Caddy imajı (WAF + hız sınırı)
        uses: docker/build-push-action@v6
        with:
          context: /tmp/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.caddy }}:1
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
